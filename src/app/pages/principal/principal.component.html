  <div
    class="direct-access__box"
    [ngStyle]="{ '--color': '#ffca00' }"

  <div
    class="direct-access__box"
    [ngStyle]="{ '--color': '#1c64c6' }"

  </div>
  <a
    class="direct-access__box"
    [ngStyle]="{ '--color': '#0d9488' }"
